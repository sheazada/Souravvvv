services:
  dairy-erp-test-db:
    image: postgres:16
    container_name: dairy-erp-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dairy_erp_test
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dairy_erp_test']
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - dairy_erp_test_db_data:/var/lib/postgresql/data

volumes:
  dairy_erp_test_db_data:
