name: Frontend UI Tests

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ui-tests.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ui-tests.yml'
  workflow_dispatch:

jobs:
  frontend-ui-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend product-scope typecheck
        run: npm run typecheck:products

      - name: Run full frontend typecheck
        run: npm run typecheck -- --pretty false

      - name: Run frontend lookup tests
        run: npm run test:lookups

      - name: Run frontend product flow tests
        run: npm run test:products

      - name: Run frontend operations flow tests
        run: npm run test:operations
